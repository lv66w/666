let cur = 0;
let okCnt = 0,errCnt=0;
let wrongList = JSON.parse(localStorage.getItem("wrongBookJudge")||"[]");

function shuffle(arr){
    let a=[...arr];
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}

function render(){
    const item = list[cur];
    document.getElementById("curInfo").innerText = `${cur+1}/${list.length}`;
    document.getElementById("ok").innerText=okCnt;
    document.getElementById("err").innerText=errCnt;
    document.getElementById("wrongCount").innerText = wrongList.length;
    document.getElementById("qIndex").innerText = `第${item.qid}题`;
    document.getElementById("qText").innerText = item.q;
    document.getElementById("ansBox").style.display="none";
    const wrap = document.getElementById("optionsWrap");
    wrap.innerHTML="";
    const optTrue = document.createElement("div");
    optTrue.className="opt";
    optTrue.innerText="√ 正确";
    optTrue.dataset.key="√";
    optTrue.onclick=()=>checkAnswer("√",optTrue);
    wrap.appendChild(optTrue);

    const optFalse = document.createElement("div");
    optFalse.className="opt";
    optFalse.innerText="× 错误";
    optFalse.dataset.key="×";
    optFalse.onclick=()=>checkAnswer("×",optFalse);
    wrap.appendChild(optFalse);
}

function checkAnswer(selKey,dom){
    const item = list[cur];
    const ansBox = document.getElementById("ansBox");
    ansBox.style.display="block";
    document.getElementById("realAns").innerText = item.ans;
    document.getElementById("explain").innerText = item.desc;
    const allOpt = document.querySelectorAll(".opt");
    allOpt.forEach(o=>o.onclick=null);
    for(let o of allOpt){
        if(o.dataset.key === item.ans) o.classList.add("right");
    }
    if(selKey !== item.ans){
        dom.classList.add("wrong");
        errCnt++;
    }else{
        okCnt++;
    }
}

function nextQuestion(){
    cur++;
    if(cur>=list.length){
        alert(`刷题完成！答对${okCnt}题，答错${errCnt}题`);
        return;
    }
    render();
}

function resetOrder(){
    list = [...questionList];
    cur=0;okCnt=0;errCnt=0;
    render();
}

function resetRandom(){
    list = shuffle(questionList);
    cur=0;okCnt=0;errCnt=0;
    render();
}

function showWrong(){
    if(wrongList.length===0){alert("错题本为空");return;}
    list = [...wrongList];
    cur=0;okCnt=0;errCnt=0;
    render();
}

function collectWrong(){
    const item = list[cur];
    const has = wrongList.some(x=>x.qid===item.qid);
    if(!has){
        wrongList.push(item);
        localStorage.setItem("wrongBookJudge",JSON.stringify(wrongList));
        alert("已加入错题本");
        document.getElementById("wrongCount").innerText = wrongList.length;
    }else{
        alert("本题已经在错题本");
    }
}

function clearWrong(){
    wrongList=[];
    localStorage.removeItem("wrongBookJudge");
    document.getElementById("wrongCount").innerText = 0;
    alert("错题本已清空");
}

resetOrder();
</script>
</body>
</html>
